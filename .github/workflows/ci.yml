# PR と main で、テストと lint を GitHub 上でも実行する。自動マージの条件の1つ（ジョブ名 test）。
# 型 web 向け。手順は共通のアクション nosuke223/agent-workflows/ci/web にある。
name: テスト

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: nosuke223/agent-workflows/ci/web@main
      - name: 画面を操作するテストの記録を残す（失敗したとき）
        if: failure() && hashFiles('playwright.config.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
